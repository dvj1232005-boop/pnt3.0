<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Partner Treat Ultra</title>

<style>
:root {
  --primary: #4f46e5; /* Indigo sang trọng hơn */
  --primary-glow: rgba(79, 70, 229, 0.6);
  --secondary: #38bdf8;
  --success: #10b981;
  --danger: #ef4444;
  --bg-dark: #020617;
  --card-bg: rgba(15, 23, 42, 0.45);
  --card-border: rgba(255, 255, 255, 0.12);
  --item-bg: rgba(255, 255, 255, 0.04);
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
}

/* RESET */
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
}

body {
  margin: 0;
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  background: var(--bg-dark);
}

/* 🔥 PREMIUM AMBIENT & GRAIN BACKGROUND */
.ambient-bg {
  position: fixed; inset: 0; z-index: -2; overflow: hidden; background: #020617;
}
.blob {
  position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.6;
  animation: float 15s infinite alternate ease-in-out;
}
.blob-1 { top: -10%; left: -20%; width: 70vw; height: 70vw; background: #312e81; }
.blob-2 { bottom: -20%; right: -10%; width: 80vw; height: 80vw; background: #0f172a; animation-delay: -5s; }
.blob-3 { top: 30%; left: 40%; width: 60vw; height: 60vw; background: #1e3a8a; animation-delay: -2s; opacity: 0.3; }

/* Lớp hạt nhám tạo cảm giác cao cấp */
.grain-overlay {
  position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: 0.25;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
}

@keyframes float {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(40px, -60px) scale(1.15); }
}

/* LAYOUT */
.container {
  width: 100%; max-width: 440px; margin: 0 auto; padding: 24px 16px;
  display: flex; flex-direction: column; flex: 1; position: relative; z-index: 1;
}

/* SUPER GLASSMORPHISM CARD */
.card {
  background: var(--card-bg);
  backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
  border: 1px solid var(--card-border);
  border-radius: 32px; padding: 36px 24px;
  box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6), inset 0 2px 2px rgba(255,255,255,0.08);
  opacity: 0; transform: translateY(30px) scale(0.95);
  transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex; flex-direction: column; gap: 24px;
}
.card.show { opacity: 1; transform: translateY(0) scale(1); }

.header-group { text-align: center; }
.title { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px; background: linear-gradient(to right, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

/* BADGE & PROGRESS */
.stats { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.remain {
  display: inline-block; font-size: 14px; font-weight: 600; color: #fff;
  background: rgba(255, 255, 255, 0.08); padding: 6px 16px; border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.05); box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
}
.progress-bar {
  width: 100%; max-width: 220px; height: 8px; background: rgba(0,0,0,0.3);
  border-radius: 10px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
}
.progress-fill {
  height: 100%; border-radius: 10px;
  background: linear-gradient(90deg, var(--primary), var(--secondary));
  transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 0 10px var(--primary-glow);
}

/* INPUTS */
textarea {
  width: 100%; height: 130px; padding: 18px; border-radius: 20px;
  background: rgba(0,0,0,0.4); border: 1px solid var(--card-border);
  color: white; font-size: 16px; resize: none; transition: 0.3s;
  box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
}
textarea:focus { outline: none; border-color: var(--primary); background: rgba(0,0,0,0.6); box-shadow: inset 0 2px 10px rgba(0,0,0,0.5), 0 0 0 4px rgba(79, 70, 229, 0.25); }

/* 🔥 BÀN PHÍM SIÊU LỚN (LEVEL 4) */
.pinDots { display: flex; justify-content: center; gap: 20px; margin: 10px 0 30px; }
.dot {
  width: 16px; height: 16px; border-radius: 50%;
  background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.15);
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
.dot.active {
  background: #fff; border-color: #fff;
  box-shadow: 0 0 16px rgba(255, 255, 255, 0.8); transform: scale(1.2);
}
.pinDots.error .dot {
  background: var(--danger); border-color: var(--danger);
  box-shadow: 0 0 16px rgba(239, 68, 68, 0.8);
}
.shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
@keyframes shake {
  10%, 90% { transform: translate3d(-3px, 0, 0); }
  20%, 80% { transform: translate3d(5px, 0, 0); }
  30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
  40%, 60% { transform: translate3d(8px, 0, 0); }
}

.keypad { 
  display: grid; 
  grid-template-columns: repeat(3, 85px); /* Tăng mạnh kích thước phím */
  justify-content: center; 
  gap: 18px; 
  margin: 0 auto; 
}
.key {
  width: 85px; height: 85px; /* Phím to tròn hoàn hảo */
  border-radius: 50%; 
  background: rgba(255,255,255,0.03); 
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 8px 16px rgba(0,0,0,0.2), inset 0 1px 1px rgba(255,255,255,0.1);
  display: flex; align-items: center; justify-content: center;
  font-size: 34px; /* Font chữ cực lớn */
  font-weight: 500; cursor: pointer; 
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  user-select: none; color: #fff;
}
.key:active { 
  transform: scale(0.85); 
  background: rgba(255,255,255,0.15); 
  border-color: rgba(255,255,255,0.3);
  box-shadow: 0 0 25px var(--primary-glow); /* Sáng lên khi bấm */
}
.key.action-key { font-size: 26px; background: transparent; box-shadow: none; border-color: transparent; }
.key.action-key:active { background: rgba(255,255,255,0.1); }

/* BUTTONS */
button {
  width: 100%; padding: 18px; border: none; border-radius: 20px;
  background: linear-gradient(135deg, var(--primary), #4338ca); color: white; 
  font-size: 17px; font-weight: 600; letter-spacing: 0.5px;
  cursor: pointer; transition: 0.2s; 
  box-shadow: 0 10px 25px var(--primary-glow), inset 0 1px 1px rgba(255,255,255,0.2);
  display: flex; justify-content: center; align-items: center; gap: 8px;
}
button:active { transform: scale(0.96); box-shadow: 0 5px 15px var(--primary-glow); }
.btn-secondary { 
  background: rgba(255,255,255,0.06); box-shadow: inset 0 1px 1px rgba(255,255,255,0.05); 
  border: 1px solid rgba(255,255,255,0.05); color: var(--text-main); 
}
.btn-secondary:active { background: rgba(255,255,255,0.1); }
.btn-danger { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; box-shadow: none; }

/* LIST & ITEMS */
#list {
  display: flex; flex-direction: column; gap: 14px;
  max-height: 55vh; overflow-y: auto; padding-right: 4px; scroll-behavior: smooth;
}
#list::-webkit-scrollbar { width: 0px; } /* Ẩn thanh cuộn cho mượt */

.item {
  background: var(--item-bg); border: 1px solid var(--card-border);
  border-radius: 20px; padding: 18px 20px; display: flex; justify-content: space-between;
  align-items: center; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

.item:active { transform: scale(0.98); }

.code-text {
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 17px; font-weight: 700; letter-spacing: 2px; transition: 0.3s;
}

.blur { filter: blur(7px); opacity: 0.4; user-select: none; }

/* 🔥 ĐÃ DÙNG STATE */
.item.used {
  background: rgba(16, 185, 129, 0.05); border-color: rgba(16, 185, 129, 0.15); opacity: 0.6;
  box-shadow: none;
}
.item.used .code-text { text-decoration: line-through; color: var(--text-muted); filter: none; opacity: 0.5;}

/* ACTIONS IN LIST */
.actions { display: flex; gap: 10px; align-items: center; }
.icon-btn {
  width: 42px; height: 42px; background: rgba(255,255,255,0.06);
  border-radius: 14px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: 0.2s; border: 1px solid rgba(255,255,255,0.05);
}
.icon-btn:active { transform: scale(0.85); background: rgba(255,255,255,0.15); }
.icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.use-btn {
  background: linear-gradient(135deg, var(--primary), #4338ca); padding: 0 18px; height: 42px;
  border-radius: 14px; font-size: 14px; font-weight: 600;
  display: flex; align-items: center; gap: 6px; cursor: pointer; transition: 0.2s;
  box-shadow: 0 4px 12px var(--primary-glow);
}
.use-btn:active { transform: scale(0.92); }
.use-btn svg { width: 16px; height: 16px; }

.item.used .use-btn {
  background: transparent; border: 1px solid rgba(255,255,255,0.15); color: var(--text-muted); box-shadow: none;
}

.footer { text-align: center; font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.3); margin-top: auto; padding-top: 30px; letter-spacing: 1px;}
.hidden { display: none !important; }

/* 🔥 TOAST NOTIFICATIONS LEVEL 4 */
#toast-container {
  position: fixed; top: 40px; left: 0; right: 0; display: flex; flex-direction: column;
  align-items: center; gap: 12px; z-index: 9999; pointer-events: none;
}
.toast {
  background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.1); color: white; padding: 14px 28px;
  border-radius: 100px; font-size: 15px; font-weight: 600;
  box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.1);
  animation: toastIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}
@keyframes toastIn {
  from { opacity: 0; transform: translateY(-30px) scale(0.8); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* 🔥 CUSTOM MODALS LEVEL 4 */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px;
  opacity: 0; visibility: hidden; transition: 0.4s ease;
}
.modal-overlay.active { opacity: 1; visibility: visible; }
.modal-content {
  background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 32px; padding: 30px 24px; width: 100%; max-width: 380px;
  transform: translateY(30px) scale(0.9); transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 40px 80px rgba(0,0,0,0.8), inset 0 1px 2px rgba(255,255,255,0.1);
  backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
}
.modal-overlay.active .modal-content { transform: translateY(0) scale(1); }
.modal-title { font-size: 22px; font-weight: 800; margin-bottom: 16px; text-align: center; }
.modal-actions { display: flex; gap: 14px; margin-top: 24px; }
.modal-actions button { flex: 1; padding: 16px; font-size: 16px; }

</style>
</head>

<body>

<div class="ambient-bg">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>
<div class="grain-overlay"></div>

<div id="toast-container"></div>

<div class="container">

<!-- SETUP -->
<div class="card hidden" id="setup">
  <div class="header-group">
    <div class="title">Thiết lập dữ liệu</div>
    <div class="text-muted" style="font-size:15px">Nhập danh sách mã của tháng này</div>
  </div>
  <textarea id="codes" placeholder="Mỗi dòng 1 mã..."></textarea>
  <button onclick="saveInitial()">Tiếp tục</button>
</div>

<!-- LOGIN -->
<div class="card hidden" id="login">
  <div class="header-group">
    <div class="title">Xác thực</div>
    <div class="text-muted" style="font-size:15px">Nhập mã PIN để truy cập</div>
  </div>
  
  <div class="pinDots" id="dots"></div>

  <div class="keypad">
    <div class="key">1</div><div class="key">2</div><div class="key">3</div>
    <div class="key">4</div><div class="key">5</div><div class="key">6</div>
    <div class="key">7</div><div class="key">8</div><div class="key">9</div>
    <div class="key action-key">⌫</div><div class="key">0</div><div class="key action-key">✔</div>
  </div>
</div>

<!-- APP -->
<div class="card hidden" id="app">
  <div class="header-group">
    <div class="title">Partner Treat</div>
    <div class="stats">
      <div id="remain" class="remain"></div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
  </div>

  <div id="list"></div>

  <div style="display:flex; gap:14px; margin-top: 10px;">
    <button class="btn-secondary" onclick="openResetModal()" style="flex: 0.3;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline></svg>
    </button>
    <button onclick="openAddModal()" style="flex: 0.7;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      Thêm mã
    </button>
  </div>
</div>

<div class="footer">LEVEL 4 EDITION</div>

</div>

<!-- MODAL THÊM MÃ -->
<div id="add-modal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-title">Thêm mã mới</div>
    <textarea id="new-codes-input" placeholder="Dán mã vào đây..." style="height: 120px;"></textarea>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal('add-modal')">Hủy</button>
      <button onclick="confirmAdd()">Lưu lại</button>
    </div>
  </div>
</div>

<!-- MODAL RESET -->
<div id="reset-modal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-title" style="color: #f87171;">Xóa dữ liệu?</div>
    <div style="text-align: center; color: var(--text-muted); font-size: 15px; line-height: 1.5;">Hành động này sẽ xóa toàn bộ mã và cài đặt lại từ đầu.</div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal('reset-modal')">Hủy</button>
      <button class="btn-danger" onclick="confirmReset()" style="background: rgba(239, 68, 68, 0.8); color: white;">Đồng ý xóa</button>
    </div>
  </div>
</div>

<script>
const KEY="APP_FINAL";
let pinInput="";

const icons = {
  eye: `<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`,
  eyeOff: `<svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`,
  check: `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>`,
  undo: `<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline></svg>`
};

/* TOAST */
function showToast(msg) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  container.appendChild(toast);
  if(navigator.vibrate) navigator.vibrate(50);
  
  setTimeout(() => {
    toast.style.animation = 'toastIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) reverse forwards';
    setTimeout(() => toast.remove(), 400);
  }, 2500);
}

/* MODAL */
function openAddModal() {
  document.getElementById('new-codes-input').value = "";
  document.getElementById('add-modal').classList.add('active');
}
function openResetModal() { document.getElementById('reset-modal').classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

/* INIT */
function init(){
  const data=JSON.parse(localStorage.getItem(KEY));
  if(!data) return show("setup");

  if(data.month!==new Date().getMonth()){
    localStorage.removeItem(KEY);
    return show("setup");
  }

  show("login");
  renderDots();
}

function show(id){
  ["setup","login","app"].forEach(x=>{
    document.getElementById(x).classList.add("hidden");
    document.getElementById(x).classList.remove("show");
  });
  const el=document.getElementById(id);
  el.classList.remove("hidden");
  setTimeout(()=>el.classList.add("show"), 30);
}

/* SAVE */
function saveInitial(){
  const raw=document.getElementById("codes").value.trim();
  if(!raw) return showToast("Vui lòng nhập ít nhất 1 mã!");

  const codes=raw.split("\n").map(x=>x.trim()).filter(Boolean).map(x=>({code:x,used:false,show:false}));
  localStorage.setItem(KEY,JSON.stringify({ pin:"2005", codes, month:new Date().getMonth() }));
  
  showToast("Đã lưu thiết lập");
  show("login");
  renderDots();
}

/* PIN LEVEL 4 */
function renderDots(){
  const box=document.getElementById("dots");
  box.innerHTML="";
  box.className = "pinDots"; 
  for(let i=0;i<4;i++){
    const d=document.createElement("div");
    d.className="dot"+(i<pinInput.length?" active":"");
    box.appendChild(d);
  }
}

document.querySelectorAll(".key").forEach(k=>{
  k.onclick=()=>{
    const val=k.textContent;
    if(navigator.vibrate) navigator.vibrate(20); // Haptic mượt khi gõ phím

    if(val==="⌫") pinInput=pinInput.slice(0,-1);
    else if(val==="✔") checkPin();
    else if(pinInput.length<4) pinInput+=val;

    renderDots();
    if(pinInput.length===4) setTimeout(checkPin, 150);
  };
});

function checkPin(){
  const data=JSON.parse(localStorage.getItem(KEY));
  if(pinInput===data.pin){
    render();
    show("app");
  }else{
    const box=document.getElementById("dots");
    box.classList.add("error", "shake");
    if(navigator.vibrate) navigator.vibrate([50, 50, 50]);
    setTimeout(() => {
      pinInput="";
      renderDots();
    }, 450); 
  }
}

/* RENDER LIST */
function render(){
  const data=JSON.parse(localStorage.getItem(KEY));
  const list=document.getElementById("list");
  list.innerHTML="";

  let remain=0;
  let total=data.codes.length;

  if(total === 0) {
     list.innerHTML = `<div style="text-align:center; padding: 40px 20px; color: var(--text-muted); opacity: 0.7;">Chưa có mã nào. Vui lòng thêm mã mới.</div>`;
  }

  data.codes.forEach((c, index)=>{
    if(!c.used) remain++;

    const item=document.createElement("div");
    item.className="item"+(c.used?" used":"");
    item.style.animationDelay = `${index * 0.06}s`; // Thác nước mượt

    const code=document.createElement("div");
    code.className="code-text " + (c.show || c.used ?"":"blur");
    code.textContent=c.code;

    const actions=document.createElement("div");
    actions.className="actions";

    const eye=document.createElement("div");
    eye.className="icon-btn";
    eye.innerHTML = c.show ? icons.eyeOff : icons.eye;
    if(c.used) eye.style.display = 'none'; // Ẩn nút mắt nếu đã dùng

    eye.onclick=()=> {
      c.show=!c.show;
      localStorage.setItem(KEY,JSON.stringify(data));
      render();
    };

    const use=document.createElement("div");
    use.className="use-btn";
    use.innerHTML = c.used ? `${icons.undo} Hoàn tác` : `${icons.check} Dùng`;
    use.onclick=()=> {
      c.used=!c.used;
      if(c.used) {
        c.show = false; // Tự động che lại khi hoàn tác
        showToast("Đã đánh dấu sử dụng");
      }
      localStorage.setItem(KEY,JSON.stringify(data));
      render();
    };

    if(!c.used) actions.appendChild(eye); 
    actions.appendChild(use);
    item.appendChild(code); item.appendChild(actions);
    list.appendChild(item);
  });

  document.getElementById("remain").textContent=`Sẵn sàng: ${remain} / ${total}`;
  const percent = total === 0 ? 0 : ((total - remain) / total) * 100;
  document.getElementById("progress-fill").style.width = `${percent}%`;
}

function confirmAdd(){
  const input = document.getElementById("new-codes-input").value;
  if(!input.trim()) return closeModal('add-modal');

  const data=JSON.parse(localStorage.getItem(KEY));
  const newCodes = input.replace(/,/g, '\n').replace(/ /g, '\n').split("\n")
    .map(x=>x.trim()).filter(Boolean);
    
  newCodes.forEach(x=>{
    data.codes.push({code:x,used:false,show:false});
  });

  localStorage.setItem(KEY,JSON.stringify(data));
  closeModal('add-modal');
  showToast(`Đã thêm ${newCodes.length} mã mới`);
  render();
}

function confirmReset(){
  localStorage.removeItem(KEY);
  location.reload();
}

init();
</script>

</body>
</html>
