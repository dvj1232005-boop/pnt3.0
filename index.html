<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Partner Treat Pro Max</title>

<style>
:root {
  --primary: #06b6d4; /* Cyan cực cháy trên nền đen */
  --primary-dark: #0891b2;
  --primary-glow: rgba(6, 182, 212, 0.5);
  --accent: #8b5cf6;
  --success: #10b981;
  --danger: #f43f5e;
  --bg-oled: #000000;
  --card-bg: rgba(18, 18, 20, 0.6);
  --card-border: rgba(255, 255, 255, 0.08);
  --item-bg: linear-gradient(145deg, rgba(30,30,35,0.8), rgba(20,20,22,0.8));
  --text-main: #ffffff;
  --text-muted: #a1a1aa;
}

/* RESET */
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

body {
  margin: 0; color: var(--text-main); min-height: 100vh;
  display: flex; flex-direction: column; overflow-x: hidden;
  background: var(--bg-oled);
}

/* 🔥 AURORA AMBIENT BACKGROUND */
.ambient-bg {
  position: fixed; inset: 0; z-index: -2; overflow: hidden; background: #000;
}
.aurora {
  position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.5;
  animation: aurora-drift 20s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
}
.aurora-1 { top: -20%; left: -10%; width: 60vw; height: 60vw; background: #1e1b4b; }
.aurora-2 { bottom: -20%; right: -20%; width: 70vw; height: 70vw; background: #0f4a70; animation-delay: -7s; }
.aurora-3 { top: 40%; left: 30%; width: 50vw; height: 50vw; background: #4c1d95; animation-delay: -3s; opacity: 0.3; }

.grain {
  position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: 0.2;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

@keyframes aurora-drift {
  0% { transform: translate(0, 0) scale(1) rotate(0deg); }
  100% { transform: translate(50px, -50px) scale(1.2) rotate(10deg); }
}

/* RIPPLE EFFECT */
.ripple-btn { position: relative; overflow: hidden; }
.ripple {
  position: absolute; border-radius: 50%; transform: scale(0);
  animation: ripple-anim 0.6s linear; background: rgba(255,255,255,0.3); pointer-events: none;
}
@keyframes ripple-anim {
  to { transform: scale(4); opacity: 0; }
}

/* LAYOUT & LIQUID TRANSITION */
.container {
  width: 100%; max-width: 440px; margin: 0 auto; padding: 24px 16px;
  display: flex; flex-direction: column; flex: 1; position: relative; z-index: 1;
}

.screen {
  opacity: 0; transform: scale(0.92) translateY(20px);
  transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex; flex-direction: column; gap: 24px;
}
.screen.show { opacity: 1; transform: scale(1) translateY(0); }
.hidden { display: none !important; }

/* SUPER GLASS CARD */
.card {
  background: var(--card-bg);
  backdrop-filter: blur(50px); -webkit-backdrop-filter: blur(50px);
  border-top: 1px solid rgba(255,255,255,0.15);
  border-left: 1px solid rgba(255,255,255,0.08);
  border-right: 1px solid rgba(255,255,255,0.02);
  border-bottom: 1px solid rgba(255,255,255,0.02);
  border-radius: 36px; padding: 36px 24px;
  box-shadow: 0 40px 80px rgba(0,0,0,0.8), inset 0 2px 20px rgba(255,255,255,0.03);
}

.header-group { text-align: center; }
.title { 
  font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px; 
  background: linear-gradient(135deg, #fff 0%, #a1a1aa 100%); 
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
}

/* STATS BADGE & PROGRESS */
.stats { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.remain {
  display: inline-block; font-size: 14px; font-weight: 600; color: var(--primary);
  background: rgba(6, 182, 212, 0.1); padding: 8px 20px; border-radius: 30px;
  border: 1px solid rgba(6, 182, 212, 0.2); box-shadow: 0 0 20px rgba(6, 182, 212, 0.15);
}
.progress-bar {
  width: 100%; max-width: 240px; height: 6px; background: rgba(255,255,255,0.05);
  border-radius: 10px; overflow: hidden; position: relative;
}
.progress-fill {
  height: 100%; border-radius: 10px; position: relative;
  background: linear-gradient(90deg, var(--accent), var(--primary));
  transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 0 15px var(--primary-glow);
}
/* Đốm sáng ở đầu thanh progress */
.progress-fill::after {
  content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 10px;
  background: #fff; filter: blur(3px); border-radius: 50%;
}

/* INPUTS */
textarea {
  width: 100%; height: 130px; padding: 20px; border-radius: 24px;
  background: rgba(0,0,0,0.3); border: 1px solid var(--card-border);
  color: white; font-size: 16px; resize: none; transition: 0.3s;
  line-height: 1.5; box-shadow: inset 0 4px 15px rgba(0,0,0,0.5);
}
textarea:focus { outline: none; border-color: var(--primary); background: rgba(0,0,0,0.5); box-shadow: inset 0 4px 15px rgba(0,0,0,0.5), 0 0 0 4px rgba(6, 182, 212, 0.2); }

/* KEYPAD OLED STYLE */
.pinDots { display: flex; justify-content: center; gap: 24px; margin: 15px 0 35px; }
.dot {
  width: 18px; height: 18px; border-radius: 50%;
  background: rgba(255,255,255,0.03); border: 2px solid rgba(255,255,255,0.1);
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.dot.active {
  background: var(--primary); border-color: var(--primary);
  box-shadow: 0 0 20px var(--primary-glow); transform: scale(1.3);
}
.pinDots.error .dot {
  background: var(--danger); border-color: var(--danger); box-shadow: 0 0 20px rgba(244, 63, 94, 0.6);
}
.shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
@keyframes shake { 10%, 90% { transform: translate3d(-4px, 0, 0); } 20%, 80% { transform: translate3d(6px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-10px, 0, 0); } 40%, 60% { transform: translate3d(10px, 0, 0); } }

.keypad { display: grid; grid-template-columns: repeat(3, 85px); justify-content: center; gap: 20px; margin: 0 auto; }
.key {
  width: 85px; height: 85px; border-radius: 50%; position: relative; overflow: hidden;
  background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05);
  box-shadow: 0 10px 20px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.05);
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; font-weight: 500; cursor: pointer; color: #fff;
  transition: all 0.2s; user-select: none;
}
.key:active { transform: scale(0.85) translateZ(0); background: rgba(255,255,255,0.1); border-color: var(--primary); box-shadow: 0 0 25px var(--primary-glow); }
.key.action-key { font-size: 24px; background: transparent; box-shadow: none; border: none; }

/* BUTTONS */
button {
  width: 100%; padding: 20px; border: none; border-radius: 24px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; 
  font-size: 17px; font-weight: 700; letter-spacing: 0.5px;
  cursor: pointer; transition: 0.2s; position: relative; overflow: hidden;
  box-shadow: 0 10px 30px var(--primary-glow), inset 0 1px 1px rgba(255,255,255,0.3);
  display: flex; justify-content: center; align-items: center; gap: 10px;
}
button:active { transform: scale(0.95); box-shadow: 0 5px 15px var(--primary-glow); }
.btn-secondary { background: rgba(255,255,255,0.05); box-shadow: none; border: 1px solid rgba(255,255,255,0.1); color: var(--text-main); }
.btn-danger { background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.3); color: #fda4af; box-shadow: none; }

/* APPLE WALLET STYLE LIST */
#list {
  display: flex; flex-direction: column; gap: 16px;
  max-height: 52vh; overflow-y: auto; padding: 4px; padding-bottom: 20px; scroll-behavior: smooth;
}
#list::-webkit-scrollbar { width: 0px; }

.item {
  background: var(--item-bg);
  border-top: 1px solid rgba(255,255,255,0.15); border-left: 1px solid rgba(255,255,255,0.05);
  border-bottom: 1px solid rgba(0,0,0,0.5); border-right: 1px solid rgba(0,0,0,0.5);
  border-radius: 24px; padding: 22px; display: flex; justify-content: space-between;
  align-items: center; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 15px 30px rgba(0,0,0,0.4); position: relative; overflow: hidden;
}
/* Hiệu ứng bóng kính lướt qua thẻ */
.item::before {
  content: ""; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
  background: linear-gradient(to right, transparent, rgba(255,255,255,0.05), transparent);
  transform: skewX(-20deg); animation: sheen 6s infinite; pointer-events: none;
}
@keyframes sheen { 0%, 80% { left: -100%; } 100% { left: 200%; } }

@keyframes slideUp { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }

.code-wrapper { display: flex; flex-direction: column; gap: 4px; }
.code-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); font-weight: 600;}
.code-text {
  font-family: "SFMono-Regular", Menlo, Consolas, monospace;
  font-size: 20px; font-weight: 700; letter-spacing: 3px; 
  color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.3); transition: 0.3s;
}

/* ĐÃ DÙNG STATE */
.item.used { background: rgba(16, 185, 129, 0.05); border-color: rgba(16, 185, 129, 0.2); box-shadow: none; opacity: 0.6; }
.item.used::before { display: none; }
.item.used .code-text { text-decoration: line-through; color: var(--text-muted); text-shadow: none; font-size: 18px;}

/* ACTIONS IN LIST */
.actions { display: flex; gap: 10px; align-items: center; }
.icon-btn {
  width: 44px; height: 44px; background: rgba(255,255,255,0.05);
  border-radius: 16px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: 0.2s; border: 1px solid rgba(255,255,255,0.08); position: relative; overflow: hidden;
}
.icon-btn:active { transform: scale(0.85); background: rgba(255,255,255,0.15); }
.icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

.use-btn {
  background: rgba(255,255,255,0.1); padding: 0 20px; height: 44px;
  border-radius: 16px; font-size: 14px; font-weight: 700; border: 1px solid rgba(255,255,255,0.1);
  display: flex; align-items: center; gap: 6px; cursor: pointer; transition: 0.2s;
  width: 110px; justify-content: center; color: #fff; position: relative; overflow: hidden;
}
.use-btn.primary-action {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark)); border: none;
  box-shadow: 0 5px 15px var(--primary-glow);
}
.use-btn:active { transform: scale(0.92); }
.use-btn svg { width: 16px; height: 16px; }

.item.used .use-btn { background: transparent; border: 1px solid rgba(255,255,255,0.15); color: var(--text-muted); box-shadow: none; }

.footer { text-align: center; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.2); margin-top: auto; padding-top: 30px; letter-spacing: 1.5px;}

/* TOAST */
#toast-container { position: fixed; top: 40px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 9999; pointer-events: none; }
.toast {
  background: rgba(18, 18, 20, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.1); color: white; padding: 16px 32px;
  border-radius: 100px; font-size: 15px; font-weight: 600; box-shadow: 0 20px 40px rgba(0,0,0,0.8);
  animation: toastIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; display: flex; align-items: center; gap: 10px;
}
.toast::before { content: "✨"; font-size: 18px; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-40px) scale(0.8); } to { opacity: 1; transform: translateY(0) scale(1); } }

/* CUSTOM MODALS */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
  z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px;
  opacity: 0; visibility: hidden; transition: 0.4s ease;
}
.modal-overlay.active { opacity: 1; visibility: visible; }
.modal-content {
  background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 36px; padding: 32px 24px; width: 100%; max-width: 380px;
  transform: translateY(40px) scale(0.9); transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 40px 80px rgba(0,0,0,0.9), inset 0 2px 2px rgba(255,255,255,0.05);
}
.modal-overlay.active .modal-content { transform: translateY(0) scale(1); }
.modal-title { font-size: 24px; font-weight: 800; margin-bottom: 16px; text-align: center; }
.modal-actions { display: flex; gap: 14px; margin-top: 24px; }
.modal-actions button { flex: 1; padding: 18px; font-size: 16px; }

</style>
</head>

<body>

<div class="ambient-bg">
  <div class="aurora aurora-1"></div>
  <div class="aurora aurora-2"></div>
  <div class="aurora aurora-3"></div>
</div>
<div class="grain"></div>

<div id="toast-container"></div>

<div class="container">

<!-- SETUP -->
<div class="screen card hidden" id="setup">
  <div class="header-group">
    <div class="title">Khởi tạo dữ liệu</div>
    <div class="text-muted" style="font-size:15px">Nhập danh sách mã của tháng này</div>
  </div>
  <textarea id="codes" placeholder="Mỗi dòng 1 mã..."></textarea>
  <button class="ripple-btn" onclick="saveInitial(event)">Bắt đầu ngay</button>
</div>

<!-- LOGIN -->
<div class="screen card hidden" id="login">
  <div class="header-group">
    <div class="title">Bảo mật PIN</div>
    <div class="text-muted" style="font-size:15px">Vui lòng xác thực để truy cập ví</div>
  </div>
  
  <div class="pinDots" id="dots"></div>

  <div class="keypad">
    <div class="key ripple-btn">1</div><div class="key ripple-btn">2</div><div class="key ripple-btn">3</div>
    <div class="key ripple-btn">4</div><div class="key ripple-btn">5</div><div class="key ripple-btn">6</div>
    <div class="key ripple-btn">7</div><div class="key ripple-btn">8</div><div class="key ripple-btn">9</div>
    <div class="key action-key ripple-btn">⌫</div><div class="key ripple-btn">0</div><div class="key action-key ripple-btn">✔</div>
  </div>
</div>

<!-- APP -->
<div class="screen hidden" id="app" style="gap: 16px;">
  <div class="card" style="padding: 24px; border-radius: 32px;">
    <div class="header-group">
      <div class="title" style="font-size: 24px;">Ví Partner Treat</div>
      <div class="stats">
        <div id="remain" class="remain"></div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
    </div>
  </div>

  <div id="list"></div>

  <div style="display:flex; gap:14px; margin-top: 4px;">
    <button class="btn-secondary ripple-btn" onclick="openResetModal(event)" style="flex: 0.25; padding:0; height: 60px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline></svg>
    </button>
    <button class="ripple-btn" onclick="openAddModal(event)" style="flex: 0.75; height: 60px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      Nạp thêm mã
    </button>
  </div>
  <div class="footer">Bản quyền 2026 DangTung</div>
</div>

</div>

<!-- MODAL THÊM MÃ -->
<div id="add-modal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-title">Nạp mã mới</div>
    <textarea id="new-codes-input" placeholder="Dán các mã mới vào đây..." style="height: 120px;"></textarea>
    <div class="modal-actions">
      <button class="btn-secondary ripple-btn" onclick="closeModal('add-modal', event)">Hủy</button>
      <button class="ripple-btn" onclick="confirmAdd(event)">Lưu vào ví</button>
    </div>
  </div>
</div>

<!-- MODAL RESET -->
<div id="reset-modal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-title" style="color: #f43f5e;">Hủy toàn bộ ví?</div>
    <div style="text-align: center; color: var(--text-muted); font-size: 15px; line-height: 1.6;">Hành động này sẽ xóa vĩnh viễn toàn bộ mã và yêu cầu cài đặt lại từ đầu.</div>
    <div class="modal-actions">
      <button class="btn-secondary ripple-btn" onclick="closeModal('reset-modal', event)">Hủy</button>
      <button class="btn-danger ripple-btn" onclick="confirmReset(event)">Đồng ý xóa</button>
    </div>
  </div>
</div>

<script>
const KEY="APP_FINAL";
let pinInput="";
let animatedCount=0;

const icons = {
  eye: `<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`,
  eyeOff: `<svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`,
  check: `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>`,
  undo: `<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline></svg>`
};

/* RIPPLE EFFECT CORE */
function createRipple(event) {
  const button = event.currentTarget;
  const circle = document.createElement("span");
  const diameter = Math.max(button.clientWidth, button.clientHeight);
  const radius = diameter / 2;
  const rect = button.getBoundingClientRect();
  
  // Xử lý cả click chuột và touch trên mobile
  const clientX = event.touches ? event.touches[0].clientX : event.clientX;
  const clientY = event.touches ? event.touches[0].clientY : event.clientY;

  circle.style.width = circle.style.height = `${diameter}px`;
  circle.style.left = `${clientX - rect.left - radius}px`;
  circle.style.top = `${clientY - rect.top - radius}px`;
  circle.classList.add("ripple");

  const ripple = button.querySelector(".ripple");
  if (ripple) ripple.remove();
  button.appendChild(circle);
}

document.querySelectorAll('.key').forEach(btn => {
  // Mobile touch start để mượt hơn
  btn.addEventListener('touchstart', createRipple, {passive: true});
  btn.addEventListener('mousedown', createRipple);
});

/* TOAST */
function showToast(msg) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  container.appendChild(toast);
  if(navigator.vibrate) navigator.vibrate(50);
  
  setTimeout(() => {
    toast.style.animation = 'toastIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) reverse forwards';
    setTimeout(() => toast.remove(), 400);
  }, 2500);
}

/* MODAL */
function openAddModal(e) { if(e) createRipple(e); document.getElementById('new-codes-input').value = ""; document.getElementById('add-modal').classList.add('active'); }
function openResetModal(e) { if(e) createRipple(e); document.getElementById('reset-modal').classList.add('active'); }
function closeModal(id, e) { if(e) createRipple(e); document.getElementById(id).classList.remove('active'); }

/* SCREEN TRANSITIONS */
function showScreen(id){
  ["setup","login","app"].forEach(x=>{
    const el = document.getElementById(x);
    el.classList.remove("show");
    setTimeout(() => { if(!el.classList.contains("show")) el.classList.add("hidden"); }, 400);
  });
  
  setTimeout(() => {
    const target = document.getElementById(id);
    target.classList.remove("hidden");
    // Trigger reflow
    void target.offsetWidth;
    target.classList.add("show");
  }, 50); // Đợi màn kia mờ đi một xíu
}

/* INIT */
function init(){
  const data=JSON.parse(localStorage.getItem(KEY));
  if(!data) return showScreen("setup");

  if(data.month!==new Date().getMonth()){
    localStorage.removeItem(KEY);
    return showScreen("setup");
  }

  showScreen("login");
  renderDots();
}

/* SAVE */
function saveInitial(e){
  if(e) createRipple(e);
  const raw=document.getElementById("codes").value.trim();
  if(!raw) return showToast("Vui lòng nhập ít nhất 1 mã!");

  const codes=raw.split("\n").map(x=>x.trim()).filter(Boolean).map(x=>({code:x,used:false,show:false}));
  localStorage.setItem(KEY,JSON.stringify({ pin:"2005", codes, month:new Date().getMonth() }));
  
  showToast("Đã khởi tạo ví");
  showScreen("login");
  renderDots();
}

/* PIN */
function renderDots(){
  const box=document.getElementById("dots");
  box.innerHTML=""; box.className = "pinDots"; 
  for(let i=0;i<4;i++){
    const d=document.createElement("div");
    d.className="dot"+(i<pinInput.length?" active":"");
    box.appendChild(d);
  }
}

document.querySelectorAll(".key").forEach(k=>{
  k.onclick=(e)=>{
    const val=k.textContent;
    if(navigator.vibrate) navigator.vibrate(20); 

    if(val==="⌫") pinInput=pinInput.slice(0,-1);
    else if(val==="✔") checkPin();
    else if(pinInput.length<4) pinInput+=val;

    renderDots();
    if(pinInput.length===4) setTimeout(checkPin, 150);
  };
});

function checkPin(){
  const data=JSON.parse(localStorage.getItem(KEY));
  if(pinInput===data.pin){
    render();
    showScreen("app");
  }else{
    const box=document.getElementById("dots");
    box.classList.add("error", "shake");
    if(navigator.vibrate) navigator.vibrate([50, 50, 50]);
    setTimeout(() => { pinInput=""; renderDots(); }, 450); 
  }
}

/* RENDER LIST - APPLE WALLET STYLE WITH REAL MASKING */
function render(){
  const data=JSON.parse(localStorage.getItem(KEY));
  const list=document.getElementById("list");
  const currentScroll = list.scrollTop;
  
  list.innerHTML="";
  let remain=0;
  let total=data.codes.length;

  if(total === 0) {
     list.innerHTML = `<div style="text-align:center; padding: 40px 20px; color: var(--text-muted); opacity: 0.7;">Ví trống. Vui lòng nạp thêm mã.</div>`;
     animatedCount = 0;
  }

  data.codes.forEach((c, index)=>{
    if(!c.used) remain++;

    const item=document.createElement("div");
    item.className="item"+(c.used?" used":"");
    
    if(index >= animatedCount) {
        item.style.animation = `slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both`;
        item.style.animationDelay = `${(index - animatedCount) * 0.08}s`;
    }

    // Phần Text Mã: Ứng dụng Masking thực tế
    const codeWrapper = document.createElement("div");
    codeWrapper.className = "code-wrapper";
    
    const label = document.createElement("div");
    label.className = "code-label";
    label.textContent = `Thẻ số ${String(index + 1).padStart(2, '0')}`;
    
    const code=document.createElement("div");
    code.className="code-text";
    
    // Logic Masking cực đỉnh
    if(c.used) {
        code.textContent = c.code; // Đã dùng thì hiện luôn
    } else {
        // Che mã bằng dấu •. Ví dụ: ABCDEF -> ••••••
        code.textContent = c.show ? c.code : "•".repeat(c.code.length || 8);
        if(!c.show) code.style.letterSpacing = "6px"; // Tăng space cho dấu chấm đẹp hơn
    }

    codeWrapper.appendChild(label);
    codeWrapper.appendChild(code);

    const actions=document.createElement("div");
    actions.className="actions";

    const eye=document.createElement("div");
    eye.className="icon-btn ripple-btn";
    eye.innerHTML = c.show ? icons.eyeOff : icons.eye;
    if(c.used) eye.style.display = 'none';

    eye.onclick=(e)=> {
      createRipple(e);
      if(navigator.vibrate) navigator.vibrate(15);
      c.show=!c.show;
      localStorage.setItem(KEY,JSON.stringify(data));
      setTimeout(render, 150); // Delay nhẹ để thấy ripple
    };

    const use=document.createElement("div");
    use.className="use-btn ripple-btn " + (c.used ? "" : "primary-action");
    use.innerHTML = c.used ? `${icons.undo} Hoàn tác` : `${icons.check} Sử dụng`;
    
    use.onclick=(e)=> {
      createRipple(e);
      if(navigator.vibrate) navigator.vibrate([30, 50, 30]); // Haptic mạnh hơn khi dùng
      c.used=!c.used;
      if(c.used) { c.show = false; showToast("Giao dịch thành công"); }
      localStorage.setItem(KEY,JSON.stringify(data));
      setTimeout(render, 200);
    };

    if(!c.used) actions.appendChild(eye); 
    actions.appendChild(use);
    item.appendChild(codeWrapper); item.appendChild(actions);
    list.appendChild(item);
  });
  
  animatedCount = total;

  document.getElementById("remain").textContent=`Khả dụng: ${remain} / ${total} thẻ`;
  const percent = total === 0 ? 0 : ((total - remain) / total) * 100;
  document.getElementById("progress-fill").style.width = `${percent}%`;
  
  list.scrollTop = currentScroll;
}

function confirmAdd(e){
  if(e) createRipple(e);
  const input = document.getElementById("new-codes-input").value;
  if(!input.trim()) {
    setTimeout(() => closeModal('add-modal'), 200);
    return;
  }

  const data=JSON.parse(localStorage.getItem(KEY));
  const newCodes = input.replace(/,/g, '\n').replace(/ /g, '\n').split("\n")
    .map(x=>x.trim()).filter(Boolean);
    
  newCodes.forEach(x=>{ data.codes.push({code:x,used:false,show:false}); });

  localStorage.setItem(KEY,JSON.stringify(data));
  setTimeout(() => {
    closeModal('add-modal');
    showToast(`Đã nạp thành công ${newCodes.length} thẻ`);
    render();
  }, 200);
}

function confirmReset(e){
  if(e) createRipple(e);
  setTimeout(() => {
    localStorage.removeItem(KEY);
    location.reload();
  }, 300);
}

init();
</script>
