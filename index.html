<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Partner Treat</title>

<style>
:root{
  --primary:#3b82f6;
  --card:#0f172a;
}

/* RESET */
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color: transparent;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  color:white;
  min-height:100vh;
}

/* 🔥 GRADIENT ĐỘNG */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:linear-gradient(120deg,#020617,#1e293b,#020617);
  background-size:200% 200%;
  animation:bgMove 8s ease infinite;
  z-index:-1;
}
@keyframes bgMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

/* LAYOUT */
.container{
  max-width:420px;
  margin:auto;
  padding:20px;
}

/* CARD */
.card{
  background:rgba(15,23,42,0.85);
  backdrop-filter:blur(20px);
  border-radius:24px;
  padding:20px;
  margin-top:20px;
  box-shadow:0 25px 60px rgba(0,0,0,0.5);
  opacity:0;
  transform:translateY(10px);
  transition:.35s;
}
.card.show{
  opacity:1;
  transform:translateY(0);
}

.title{
  font-size:20px;
  font-weight:700;
}

/* REMAIN */
.remain{
  font-size:13px;
  opacity:0.7;
  margin-top:6px;
}

/* KEYPAD */
.pinDots{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:20px 0;
}
.dot{
  width:12px;height:12px;
  border-radius:50%;
  background:#1e293b;
}
.dot.active{background:#3b82f6}

.keypad{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.key{
  background:#1e293b;
  padding:16px;
  border-radius:16px;
  text-align:center;
  font-size:18px;
}
.key:active{transform:scale(0.9)}

/* BUTTON */
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  margin-top:12px;
  background:var(--primary);
  color:white;
}

/* LIST */
.item{
  background:var(--card);
  border-radius:16px;
  padding:14px;
  margin-top:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* 🔥 ĐÃ DÙNG */
.item.used{
  background:linear-gradient(135deg,#065f46,#022c22);
  box-shadow:0 0 12px rgba(34,197,94,0.5);
}

.blur{filter:blur(6px)}

.actions{display:flex;gap:8px}

.icon{
  width:34px;height:34px;
  background:#1e293b;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.use{
  background:var(--primary);
  padding:6px 10px;
  border-radius:10px;
  font-size:12px;
}

.footer{
  text-align:center;
  font-size:12px;
  opacity:.5;
  margin-top:20px;
}

.hidden{display:none}
</style>
</head>

<body>

<div class="container">

<!-- SETUP -->
<div class="card" id="setup">
  <div class="title">Nhập mã tháng</div>
  <textarea id="codes" style="width:100%;padding:12px;border-radius:12px;background:#1e293b;color:white;font-size:16px"></textarea>
  <button onclick="save()">Lưu mã</button>
</div>

<!-- LOGIN -->
<div class="card hidden" id="login">
  <div class="title">Nhập PIN</div>
  <div class="pinDots" id="dots"></div>

  <div class="keypad">
    <div class="key">1</div><div class="key">2</div><div class="key">3</div>
    <div class="key">4</div><div class="key">5</div><div class="key">6</div>
    <div class="key">7</div><div class="key">8</div><div class="key">9</div>
    <div class="key">⌫</div><div class="key">0</div><div class="key">✔</div>
  </div>
</div>

<!-- APP -->
<div class="card hidden" id="app">
  <div class="title">Partner Treat</div>
  <div id="remain" class="remain"></div>

  <div id="list"></div>

  <button onclick="reset()">Reset</button>
  <button onclick="addMore()">+ Thêm mã</button>
</div>

<div class="footer">© DangTng</div>

</div>

<script>
const KEY="APP_FINAL";
let pinInput="";

/* INIT */
function init(){
  const data=JSON.parse(localStorage.getItem(KEY));
  if(!data) return show("setup");

  if(data.month!==new Date().getMonth()){
    localStorage.removeItem(KEY);
    return show("setup");
  }

  show("login");
  renderDots();
}

function show(id){
  ["setup","login","app"].forEach(x=>{
    document.getElementById(x).classList.add("hidden");
    document.getElementById(x).classList.remove("show");
  });

  const el=document.getElementById(id);
  el.classList.remove("hidden");

  setTimeout(()=>el.classList.add("show"),10);
}

/* SAVE */
function save(){
  const raw=document.getElementById("codes").value.trim();
  if(!raw) return alert("Nhập mã");

  const codes=raw.split("\n")
    .map(x=>x.trim())
    .filter(Boolean)
    .map(x=>({code:x,used:false,show:false}));

  localStorage.setItem(KEY,JSON.stringify({
    pin:"2005",
    codes,
    month:new Date().getMonth()
  }));

  show("login");
  renderDots();
}

/* PIN */
function renderDots(){
  const box=document.getElementById("dots");
  box.innerHTML="";
  for(let i=0;i<4;i++){
    const d=document.createElement("div");
    d.className="dot"+(i<pinInput.length?" active":"");
    box.appendChild(d);
  }
}

document.querySelectorAll(".key").forEach(k=>{
  k.onclick=()=>{
    const val=k.textContent;

    if(val==="⌫") pinInput=pinInput.slice(0,-1);
    else if(val==="✔") checkPin();
    else if(pinInput.length<4) pinInput+=val;

    renderDots();
    if(pinInput.length===4) checkPin();
  };
});

function checkPin(){
  const data=JSON.parse(localStorage.getItem(KEY));
  if(pinInput===data.pin){
    render();
    show("app");
  }else{
    alert("Sai PIN");
    pinInput="";
    renderDots();
  }
}

/* LIST */
function render(){
  const data=JSON.parse(localStorage.getItem(KEY));
  const list=document.getElementById("list");
  list.innerHTML="";

  let remain=0;

  data.codes.forEach(c=>{
    if(!c.used) remain++;

    const item=document.createElement("div");
    item.className="item"+(c.used?" used":"");

    const code=document.createElement("div");
    code.className=c.show?"":"blur";
    code.textContent=c.code;

    const actions=document.createElement("div");
    actions.className="actions";

    const eye=document.createElement("div");
    eye.className="icon";
    eye.textContent=c.show?"🙈":"👁";

    eye.onclick=()=>{
      c.show=!c.show;
      localStorage.setItem(KEY,JSON.stringify(data));
      render();
    };

    const use=document.createElement("div");
    use.className="use";
    use.textContent=c.used?"Đã dùng":"Dùng";

    use.onclick=()=>{
      c.used=!c.used;
      localStorage.setItem(KEY,JSON.stringify(data));
      render();
    };

    actions.appendChild(eye);
    actions.appendChild(use);

    item.appendChild(code);
    item.appendChild(actions);
    list.appendChild(item);
  });

  document.getElementById("remain").textContent=`Còn ${remain} mã`;
}

/* ADD */
function addMore(){
  const input=prompt("Nhập mã (mỗi dòng 1 mã):");
  if(!input) return;

  const data=JSON.parse(localStorage.getItem(KEY));

  input.split("\n")
    .map(x=>x.trim())
    .filter(Boolean)
    .forEach(x=>{
      data.codes.push({code:x,used:false,show:false});
    });

  localStorage.setItem(KEY,JSON.stringify(data));
  render();
}

/* RESET */
function reset(){
  if(confirm("Reset toàn bộ?")){
    localStorage.removeItem(KEY);
    location.reload();
  }
}

init();
</script>

</body>
</html>
